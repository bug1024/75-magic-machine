<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12132d"><title>75's MAGIC MACHINE · 王卿梧的魔法抽奖机</title><style>/* INLINE_STYLES */</style></head>
<body>
<div class="sky" aria-hidden="true"><div class="nebula"></div><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="planet planet-one"></div><div class="planet planet-two"></div></div>
<div class="danger-vignette" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>
<header class="topbar"><a class="wordmark" href="#" aria-label="75 的魔法世界"><span class="brand-star">✦</span> 75's <span>MAGIC WORLD</span></a><div class="utilities"><button id="sound" class="icon-button" aria-label="打开音效" aria-pressed="false">♪<span class="mute-slash">/</span></button><button id="motion" class="icon-button" aria-label="开启柔和动画" aria-pressed="false">✧</button><button id="fullscreen" class="icon-button" aria-label="进入全屏">⛶</button></div></header>
<main>
<div class="intro"><h1>75's <span>MAGIC MACHINE</span><i>✦</i></h1><p class="subtitle">王卿梧的魔法抽奖机</p></div>

<section class="game" aria-label="魔法抽奖机">
<div class="floating-spark spark-left" aria-hidden="true">✧</div><div class="floating-spark spark-right" aria-hidden="true">✦</div>
<div class="machine" id="machine" data-state="idle" data-reveal="sparkle-bloom">
<div class="machine-top" aria-hidden="true"><span class="status-dot"></span><span class="tiny-stars">✦ ✧ ✦</span></div>
<div class="marquee" id="marquee" aria-hidden="true"></div>
<div class="window" id="window"><div class="window-grid" aria-hidden="true"></div><div class="halo" aria-hidden="true"></div><div class="effect-ring" aria-hidden="true"></div><div class="moon-disc" aria-hidden="true"></div>
<div class="chamber" id="chamber" aria-hidden="true"><div class="vortex"></div><div class="magic-balls" id="magic-balls"></div><div class="glass-shine"></div><div class="chamber-floor"></div></div>
<div class="spell-pop" id="spell-pop" aria-hidden="true">✦ MAGIC! ✦</div>
<div class="capsule-stage" id="capsule-stage" aria-hidden="true"><div class="pedestal"></div><div class="capsule" id="capsule"><div class="capsule-aura"></div><div class="capsule-half capsule-lid"><span>✦</span></div><div class="capsule-half capsule-base"></div><div class="capsule-seam"></div><div class="capsule-crack"></div></div></div>
<div class="reveal-rays" aria-hidden="true"></div>
<div id="treasure-art" class="treasure-art" hidden></div>
<div class="window-caption"><span id="rarity" class="rarity"></span><h2 id="prize-name">你的魔法，准备好啦！</h2><p id="prize-description">按一下，让小球跳起舞。</p></div>
<div id="jackpot" class="jackpot" aria-hidden="true">SUPER<br><b>LUCKY!</b></div></div>
<div class="energy-system" aria-hidden="true"><div class="energy-pipe pipe-left"></div><div class="energy-pipe pipe-right"></div></div>
<div class="control-deck"><div class="deck-star" aria-hidden="true">✦</div><button id="draw" class="draw-button"><span id="button-text">开启魔法</span><span class="keycap">SPACE <span>↵</span></span></button><div class="deck-star" aria-hidden="true">✦</div><p id="draw-hint">按空格键，或点一下按钮</p></div>
<section class="power-panel" aria-label="魔法能量"><div class="power-heading"><span>魔法能量</span><b id="power-count">10 / 10</b><button id="recharge" class="recharge-button" aria-haspopup="dialog">充能 <span aria-hidden="true">＋</span></button></div><div class="power-row"><div id="power-cells" class="power-cells" role="img" aria-label="魔法能量"></div></div><p id="power-status" role="status" hidden></p></section>
<div class="machine-foot left-foot"></div><div class="machine-foot right-foot"></div>
</div><div class="ground-glow" aria-hidden="true"></div>
</section>
<footer class="bottom"><button id="collection" class="collection-button"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 7V5a4 4 0 0 1 8 0v2M5 7h14l2 14H3L5 7Z" stroke-linejoin="round"/><path d="m12 10 1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4L12 10Z" stroke-linejoin="round"/></svg> 我的宝藏 <span id="collection-count" class="count">0</span></button><button id="cheat" class="cheat-button" aria-pressed="false" aria-label="开启作弊模式" title="开启作弊模式，宝物等概率"><span aria-hidden="true">⚄</span> 作弊模式 <span id="cheat-state" class="cheat-state" aria-hidden="true">关</span></button></footer>
</main>
<p id="notice" class="notice" role="status" hidden></p><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="collection-dialog"><div class="dialog-header"><div><p class="eyebrow">MY LITTLE WONDERS</p><h2>我的宝藏 <span>✦</span></h2></div><button id="close-collection" class="icon-button" aria-label="关闭我的宝藏">×</button></div><p id="collection-summary" class="collection-summary"></p><div id="collection-grid" class="collection-grid"></div><p class="collection-note">这是你的魔法收藏，每一次惊喜都会留在这里。</p></dialog>
<dialog id="recharge-dialog" aria-labelledby="recharge-title"><div class="dialog-header"><div><p class="eyebrow">LITTLE MAGIC STATION</p><h2 id="recharge-title">给魔法充充电 <span>✦</span></h2></div><button id="close-recharge" class="icon-button" aria-label="关闭充能小站">×</button></div>
<div class="recharge-meter"><span>魔法能量</span><b id="recharge-count">10 / 10</b><div id="recharge-progress"><span></span></div></div>
<div id="difficulty-options" class="difficulty-options" role="group" aria-label="选择题目难度"></div>
<div id="full-energy" class="full-energy" role="status" aria-live="polite" hidden><div id="charge-burst" class="charge-burst" aria-hidden="true"></div><span class="full-heart" aria-hidden="true">♥</span><h3>能量满满啦！</h3><p>小星星准备好，去发现宝物吧。</p></div>
<form id="math-form"><div class="math-equation"><span id="math-question"></span><label class="sr-only" for="math-answer">填写答案</label><input id="math-answer" type="text" inputmode="numeric" autocomplete="off" maxlength="3" aria-describedby="answer-feedback math-hint"></div>
<div id="counting-stars" class="counting-stars" role="img"></div><p id="math-hint" class="math-hint" hidden></p><p id="answer-feedback" class="answer-feedback" role="status" aria-live="polite">答对一题，点亮一格魔法</p><div id="number-pad" class="number-pad" role="group" aria-label="数字键盘"></div><button id="answer-submit" type="submit" class="answer-submit">送出答案 ✦</button></form>
<span id="reward-star" class="reward-star" aria-hidden="true">✦</span><button id="return-to-machine" class="return-to-machine" type="button">带着能量继续玩</button></dialog>
<script id="game-config" type="application/json">/* INLINE_GAME_CONFIG */</script>
<script id="treasure-config" type="application/json">/* INLINE_CONFIG */</script><script>/* INLINE_SCRIPT */</script>
</body></html>
