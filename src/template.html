<header class="topbar"><a class="wordmark" href="#" aria-label="75 的魔法世界"><span class="brand-star">✦</span> 75's <span>MAGIC WORLD</span></a><div class="utilities"><button id="sound" class="icon-button" aria-label="打开音效" aria-pressed="false">♪<span class="mute-slash">/</span></button><button id="motion" class="icon-button" aria-label="开启柔和动画" aria-pressed="false">✧</button><button id="fullscreen" class="icon-button" aria-label="进入全屏">⛶</button></div></header>

<section class="game" aria-label="魔法抽奖机">
<div class="floating-spark spark-left" aria-hidden="true">✧</div><div class="floating-spark spark-right" aria-hidden="true">✦</div>
<div class="machine" id="machine" data-state="idle" data-reveal="sparkle-bloom">
<div class="machine-top" aria-hidden="true"><span class="status-dot"></span><span class="tiny-stars">✦ ✧ ✦</span></div>
<div class="marquee" id="marquee" aria-hidden="true"></div>
<div class="window" id="window"><div class="window-grid" aria-hidden="true"></div><div class="halo" aria-hidden="true"></div><div class="effect-ring" aria-hidden="true"></div><div class="moon-disc" aria-hidden="true"></div>

<div class="reveal-rays" aria-hidden="true"></div>
<div id="treasure-art" class="treasure-art" hidden></div>
<div class="window-caption"><span id="rarity" class="rarity"></span><h2 id="prize-name">你的魔法，准备好啦！</h2><p id="prize-description">按一下，让小球跳起舞。</p></div>

<div class="energy-system" aria-hidden="true"><div class="energy-pipe pipe-left"></div><div class="energy-pipe pipe-right"></div><div class="energy-meter"><div id="energy-fill"></div></div></div>
<div class="control-deck"><div class="deck-star" aria-hidden="true">✦</div><button id="draw" class="draw-button"><span id="button-text">开启魔法</span><span class="keycap">SPACE <span>↵</span></span></button><div class="deck-star" aria-hidden="true">✦</div><p id="draw-hint">按空格键，或点一下按钮</p></div>
<div class="machine-foot left-foot"></div><div class="machine-foot right-foot"></div>
</div><div class="ground-glow" aria-hidden="true"></div>
</section>
